<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحله چهارم</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #2c3e50, #4ca1af); /* پس‌زمینه جذاب */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: red;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ff6f61; /* رنگ دکمه */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #e04f4f; /* تغییر رنگ دکمه هنگام هاور */
        }

        button:active {
            transform: scale(1);
            background-color: #c03a3a; /* رنگ پس زمینه فعال */
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>مرحله چهارم</h1>
        <p>شما وارد مرحله چهارم شده‌اید.</p>

        <button id="goToFourthLink" onclick="goToFourthLink()">تکمیل مرحله چهارم</button>
    </div>

    <script>
        // بررسی اینکه آیا صفحه سوم تکمیل شده است یا نه
        function goToFourthLink() {
            // اگر صفحه سوم تکمیل نشده باشد، هدایت به صفحه سوم
            if (localStorage.getItem('page3Completed') !== 'true') {
                alert('لطفاً ابتدا صفحه سوم را تکمیل کنید.');
                window.location.href = 'page3.html'; // هدایت به صفحه سوم
            } else {
                // اگر صفحه سوم تکمیل شده باشد، هدایت به لینک مرحله چهارم
                window.location.href = 'https://survey.porsline.ir/s/ACaAwuDK'; // لینک مرحله چهارم
            }
        }

        // اگر صفحه سوم تکمیل نشده باشد، دکمه غیر فعال می‌شود و پیامی نشان داده می‌شود
        if (localStorage.getItem('page3Completed') !== 'true') {
            document.getElementById('goToFourthLink').disabled = true;
            document.getElementById('goToFourthLink').innerText = "لطفاً ابتدا صفحه سوم را تکمیل کنید";
        }
    </script>
</body>
</html>
