<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یه حرف کوچیک ❤️</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}


body{

height:100vh;
margin:0;

display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(135deg,#ff758c,#ff7eb3);

overflow:hidden;

}


.container{

width:90%;
max-width:450px;

background:white;

padding:35px 25px;

border-radius:35px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.2);

}


.heart{

font-size:80px;

animation:heart 1.2s infinite;

}


@keyframes heart{

50%{
transform:scale(1.2);
}

}



h1{

color:#e63946;

font-size:28px;

}



p{

font-size:17px;

line-height:2;

color:#555;

}



button{

border:none;

border-radius:50px;

padding:15px 35px;

font-size:20px;

cursor:pointer;

transition:.3s;

}



#yes,#save{

background:#e63946;

color:white;

}



#no{

background:#ddd;

position:absolute;

}



.buttons{

height:90px;

position:relative;

margin-top:30px;

}



#page2,#page3{

display:none;

}



.box{

display:flex;

flex-direction:column;

gap:15px;

margin:25px 0;

}



input{

padding:15px;

border-radius:20px;

border:1px solid #ddd;

font-size:16px;

text-align:center;

}



.typing{

min-height:200px;

white-space:pre-line;

}



.heart-bg{

position:fixed;

font-size:25px;

animation:fall 5s linear infinite;

}


@keyframes fall{

from{
transform:translateY(-100px);
}

to{
transform:translateY(100vh);
}

}


</style>

</head>



<body>


<div class="container">



<!-- صفحه اول -->

<div id="page1">


<div class="heart">
❤️
</div>


<h1>
میای باهم صحبت کنیم؟
</h1>


<p>
شاید هنوز چندتا حرف مونده که باید آروم و قشنگ بزنیم...
</p>


<div class="buttons">

<button id="yes">
آره ❤️
</button>


<button id="no">
نه
</button>


</div>


</div>






<!-- صفحه دوم -->


<div id="page2">


<div class="heart">
💌
</div>


<h1>
پس بیا یه قرار کوچیک داشته باشیم ❤️
</h1>


<p>
این دوری رو با یه دیدار قشنگ تموم کنیم...
</p>



<div class="box">


<input type="date" id="date">


<input type="time" id="time">


<input type="text" id="place" placeholder="📍 مکان قرار">


</div>



<button id="save">
ثبت قرار ❤️
</button>


</div>







<!-- صفحه سوم -->


<div id="page3">


<div class="heart">
🥺❤️
</div>


<h1>
برای تو...
</h1>


<p class="typing" id="text"></p>


</div>




</div>





<script>


const yes=document.getElementById("yes");

const no=document.getElementById("no");

let size=20;



function moveNo(){


let x=Math.random()*250-125;

let y=Math.random()*150-75;


no.style.transform=
`translate(${x}px,${y}px)`;


size+=8;


yes.style.fontSize=size+"px";


}


no.addEventListener("mouseover",moveNo);

no.addEventListener("touchstart",moveNo);





yes.onclick=function(){


document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="block";


};






document.getElementById("save").onclick=function(){



let date=document.getElementById("date").value;

let time=document.getElementById("time").value;

let place=document.getElementById("place").value;



if(date && time && place){


document.getElementById("page2").style.display="none";


document.getElementById("page3").style.display="block";



startTyping();



}

else{


alert("همه قسمت‌ها رو پر کن ❤️");


}


};







function startTyping(){


let text=
`درست یک هفته از هم دور بودیم...

ولی بیا با دیدار هم،
این دوری رو تموم کنیم.

بیا دوباره کنار هم بشینیم،
حرف بزنیم،
بخندیم و حال خوبمون رو برگردونیم ❤️

من مثل قرار هر شب،
ساعت ۱۲ بهت زنگ میزنم...

پیشی میشی؟ 🥺❤️

اشی مشی کوچولوی من ❤️

منتظرم...`;



let i=0;


let box=document.getElementById("text");


let timer=setInterval(()=>{


box.innerHTML+=text[i];

i++;


if(i>=text.length){

clearInterval(timer);

}


},70);



}







// قلب های متحرک


setInterval(()=>{


let heart=document.createElement("div");

heart.className="heart-bg";

heart.innerHTML="❤️";


heart.style.left=Math.random()*100+"%";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},5000);



},800);



</script>


</body>

</html>
