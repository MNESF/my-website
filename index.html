<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یه حرف کوچیک ❤️</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@latest/dist/css/persian-datepicker.min.css">

<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker/dist/js/persian-datepicker.min.js"></script>


<style>

*{
box-sizing:border-box;
font-family:tahoma;
}


body{

min-height:100vh;

margin:0;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#ff758c,#ff7eb3);

overflow-y:auto;

padding:20px;

-webkit-overflow-scrolling:touch;

}



.container{

width:90%;

max-width:450px;

max-height:90vh;

overflow-y:auto;

background:white;

padding:35px 25px;

border-radius:35px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.2);

}



.heart{

font-size:80px;

animation:pulse 1.2s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.2);

}

}



h1{

color:#e63946;

font-size:28px;

}



p{

font-size:17px;

line-height:2;

color:#555;

}



button{

border:none;

border-radius:50px;

padding:15px 35px;

font-size:20px;

cursor:pointer;

}



#yes,#save{

background:#e63946;

color:white;

}



#no{

background:#ddd;

position:absolute;

}



.buttons{

height:90px;

position:relative;

margin-top:30px;

}



#page2,#page3{

display:none;

}



input{

width:100%;

padding:15px;

border-radius:20px;

border:1px solid #ddd;

font-size:16px;

text-align:center;

margin:10px 0;

background:white;

}



.typing{

white-space:pre-line;

min-height:250px;

}



.heart-bg{

position:fixed;

top:-50px;

font-size:25px;

animation:fall 5s linear infinite;

z-index:-1;

}



@keyframes fall{

to{

transform:translateY(110vh);

}

}



</style>


</head>



<body>



<div class="container">



<!-- صفحه اول -->


<div id="page1">


<div class="heart">
❤️
</div>


<h1>
میای باهم صحبت کنیم؟
</h1>


<p>
شاید هنوز چندتا حرف مونده که باید آروم و قشنگ بزنیم...
</p>



<div class="buttons">


<button id="yes">
آره ❤️
</button>


<button id="no">
نه
</button>


</div>



</div>







<!-- صفحه دوم -->


<div id="page2">


<div class="heart">
💌
</div>


<h1>
پس بیا یه قرار کوچیک داشته باشیم ❤️
</h1>


<p>
این دوری رو با یه دیدار قشنگ تموم کنیم...
</p>



<input 
id="date"
placeholder="📅 انتخاب تاریخ قرار"
readonly>



<input
type="time"
id="time"
step="300"
lang="fa">



<input
id="place"
placeholder="📍 مکان قرار">



<button id="save">
ثبت قرار ❤️
</button>



</div>








<!-- صفحه سوم -->


<div id="page3">


<div class="heart">
🥺❤️
</div>


<h1>
برای تو...
</h1>


<p id="text" class="typing"></p>


</div>



</div>






<script>



// تقویم شمسی


$("#date").persianDatepicker({

format:"YYYY/MM/DD",

autoClose:true,

initialValue:false

});







// فرار کردن دکمه نه


const yes=document.getElementById("yes");

const no=document.getElementById("no");


let size=20;



function moveNo(){


let x=Math.random()*250-125;

let y=Math.random()*150-75;


no.style.transform=
`translate(${x}px,${y}px)`;


size+=8;


yes.style.fontSize=size+"px";


}



no.addEventListener("mouseover",moveNo);

no.addEventListener("touchstart",moveNo);







// رفتن صفحه دوم


yes.onclick=function(){


document.getElementById("page1").style.display="none";


document.getElementById("page2").style.display="block";


};








// ثبت قرار


document.getElementById("save").onclick=function(){


let date=
document.getElementById("date").value;



let time=
document.getElementById("time").value;



let place=
document.getElementById("place").value;




if(date && time && place){


document.getElementById("page2").style.display="none";


document.getElementById("page3").style.display="block";



startTyping(date,time,place);


}

else{


alert("تاریخ، ساعت و مکان رو کامل کن ❤️");


}



};







function startTyping(date,time,place){



let text=

`درست یک هفته از هم دور بودیم...

ولی بیا با دیدار هم،
این دوری رو تموم کنیم ❤️

بیا دوباره کنار هم بشینیم،
حرف بزنیم و بخندیم...

قرارمون:

📅 ${date}

⏰ ${time}

📍 ${place}


من مثل قرار هر شب،
ساعت ۱۲ بهت زنگ میزنم...

پیشی میشی 🥺❤️

اشی مشی کوچولوی من ❤️

این سایتو فقط برای تو درست کردم چون ارزششو داری

منتظرم...`;



let i=0;


let box=document.getElementById("text");


let timer=setInterval(()=>{


box.innerHTML+=text[i];


i++;


if(i>=text.length){

clearInterval(timer);

}


},60);



}








// قلب های متحرک


setInterval(()=>{


let h=document.createElement("div");


h.className="heart-bg";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},5000);



},800);



</script>


</body>

</html>
