<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>به موسسه مهندسی رهاب خوش آمدید </title>
    <style>
        body {
            font-family: 'Arial', sans-serif;

            /* بک‌گراند تصویری */
            background-image: url("https://raw.githubusercontent.com/MNESF/my-website/main/back1.jpg");
            background-size: cover;          /* کل صفحه رو پر کنه */
            background-position: center;     /* وسط چین */
            background-repeat: no-repeat;    /* تکرار نشه */
            background-attachment: fixed;    /* موقع اسکرول ثابت بمونه */

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: red;
            text-align: center;
        }

         h1 {
    font-size: 1rem;
    margin-bottom: 20px;
    color: black; /* رنگ عنوان مشکی */
    font-weight: bold; /* اعمال ضخامت به فونت */
    font-family: 'Arial', sans-serif; /* انتخاب فونت تیتر */
}


        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #d55c4e; /* تغییر رنگ دکمه هنگام هاور */
        }

        button:active {
            transform: scale(1);
            background-color: #b74a3a; /* رنگ پس زمینه فعال */
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
        }

        .image-container {
            width: 200px;  /* عرض مربع */
            height: 215px; /* ارتفاع مربع */
            margin: 20px auto; /* فاصله از بالا و پایین */
            overflow: hidden; /* مخفی کردن قسمت‌های اضافی */
            border-radius: 10px; /* گوشه‌های نرم */
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* برای اینکه تصویر به صورت کامل در مربع قرار بگیرد */
        }

        .text-above {
            margin-bottom: 20px; /* فاصله از تصویر */
        }

        .text-below {
            margin-top: 20px; /* فاصله از تصویر */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- متن بالای تصویر -->
        <h1 class="text-above">سیزدهمین نمایشگاه تخصصی مدیریت شهری مشهد</h1>

        <!-- قرار دادن تصویر داخل یک مربع -->
        <div class="image-container">
            <img src="https://github.com/MNESF/my-website/raw/main/Untit%D8%B2%D8%B3%DB%8C%D8%B2%D8%B7%D8%B8led.png" alt="توضیح تصویر">
        </div>

        <!-- متن پایین تصویر -->
        <h1 class="text-below">برای پیدا کردن موقعیت موسسه مهندسی رهاب و دریافت جایزه بر روی لینک زیر کلید کنید</h1>

        <button onclick="completeStep()">اینجا کلید کنید</button>
    </div>

    <script>
        // زمانی که کاربر دکمه را کلیک می‌کند، صفحه اول تکمیل می‌شود
        function completeStep() {
            // ذخیره وضعیت تکمیل صفحه اول در localStorage
            localStorage.setItem('page1Completed', 'true');
            
            // هدایت کاربر به لینک مرحله اول (فرم پرسشنامه)
            window.location.href = 'https://survey.porsline.ir/s/gVU62gDq'; // لینک مرحله اول
        }
    </script>
</body>
</html>
