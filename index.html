<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اول</title>
</head>
<body>
    <h1>مرحله اول</h1>
    <p>برای ادامه به مرحله دوم، ابتدا باید این صفحه را تکمیل کنید.</p>

    <button onclick="completeStep()">تکمیل مرحله اول</button>

    <script>
        // زمانی که کاربر دکمه را کلیک می‌کند، صفحه اول تکمیل می‌شود
        function completeStep() {
            // ذخیره وضعیت تکمیل صفحه اول در localStorage
            localStorage.setItem('page1Completed', 'true');
            alert('شما مرحله اول را تکمیل کردید! حالا می‌توانید به مرحله بعدی بروید.');
        }
    </script>
</body>
</html>
