<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یه حرف کوچیک ❤️</title>


<style>

*{
    box-sizing:border-box;
    font-family:Tahoma, sans-serif;
}


body{

    height:100vh;
    margin:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#ff758c,#ff7eb3);

    overflow:hidden;

}



.container{

    width:90%;
    max-width:430px;

    background:white;

    padding:35px 25px;

    border-radius:35px;

    text-align:center;

    box-shadow:0 20px 60px rgba(0,0,0,.2);

}



.heart{

    font-size:80px;

    animation:beat 1.2s infinite;

}



@keyframes beat{

    50%{
        transform:scale(1.2);
    }

}



h1{

    color:#e63946;

    font-size:30px;

}



p{

    color:#555;

    line-height:2;

    font-size:17px;

}



.buttons{

    margin-top:35px;

    height:80px;

    position:relative;

}



button{

    border:none;

    border-radius:50px;

    padding:15px 35px;

    font-size:20px;

    cursor:pointer;

    transition:.3s;

}



#yes{

    background:#e63946;

    color:white;

}



#no{

    background:#ddd;

    color:#555;

    position:absolute;

    right:40px;

}




/* صفحه دوم */


#page2{

    display:none;

}



.box{

    display:flex;

    flex-direction:column;

    gap:15px;

    margin:25px 0;

}



input{

    padding:15px;

    border-radius:20px;

    border:1px solid #ddd;

    font-size:16px;

    text-align:center;

}



#save{

    background:#e63946;

    color:white;

}



#final{

    display:none;

}




</style>


</head>



<body>


<div class="container">



<!-- صفحه اول -->


<div id="page1">


<div class="heart">
❤️
</div>



<h1>
میای باهم صحبت کنیم؟
</h1>


<p>
شاید هنوز چندتا حرف مونده که باید آروم و قشنگ بزنیم...
</p>



<div class="buttons">


<button id="yes">
آره ❤️
</button>


<button id="no">
نه
</button>


</div>



</div>






<!-- صفحه دوم -->


<div id="page2">


<div class="heart">
💌
</div>



<h1>
پس بیا یه قرار کوچیک داشته باشیم ❤️
</h1>



<p>
این بار آروم و بدون عجله حرف می‌زنیم...
</p>



<div class="box">


<input 
type="date"
id="date">



<input
type="time"
id="time">



<input
type="text"
id="place"
placeholder="📍 مکان قرار">



</div>



<button id="save">
ثبت قرار ❤️
</button>



</div>







<!-- پایان -->


<div id="final">


<div class="heart">
🥰
</div>


<h1>
قرارمون ثبت شد ❤️
</h1>


<p id="result">

</p>


</div>



</div>






<script>



const yes =
document.getElementById("yes");


const no =
document.getElementById("no");


let size=20;



function moveNo(){


let x =
Math.random()*250-125;


let y =
Math.random()*150-75;



no.style.transform=
`translate(${x}px,${y}px)`;



size+=7;


yes.style.fontSize=
size+"px";


}



no.addEventListener(
"mouseover",
moveNo
);



no.addEventListener(
"touchstart",
moveNo
);





yes.addEventListener(
"click",
()=>{


document.getElementById("page1").style.display="none";


document.getElementById("page2").style.display="block";


}

);







document.getElementById("save")
.addEventListener(
"click",
()=>{


let date=
document.getElementById("date").value;


let time=
document.getElementById("time").value;


let place=
document.getElementById("place").value;



if(date && time && place){


document.getElementById("page2").style.display="none";


document.getElementById("final").style.display="block";


document.getElementById("result").innerHTML=
`
📅 ${date}
<br>
⏰ ${time}
<br>
📍 ${place}
<br><br>
منتظرم که باهم حرف بزنیم ❤️
`;



}

else{


alert("همه قسمت‌ها رو پر کن ❤️");


}



}

);



</script>



</body>

</html>
