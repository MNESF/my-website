<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحله سوم</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ff5f6d, #ffc3a0); /* پس‌زمینه جذاب */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: red;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ff6f61; /* رنگ دکمه */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #e04f4f; /* تغییر رنگ دکمه هنگام هاور */
        }

        button:active {
            transform: scale(1);
            background-color: #c03a3a; /* رنگ پس زمینه فعال */
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>مرحله سوم</h1>
        <p>شما وارد مرحله سوم شده‌اید.</p>

        <button id="goToThirdLink" onclick="completeStep()">تکمیل مرحله سوم</button>
    </div>

    <script>
        // زمانی که کاربر دکمه را کلیک می‌کند، صفحه سوم تکمیل می‌شود
        function completeStep() {
            // بررسی اینکه آیا صفحه دوم تکمیل شده است یا نه
            if (localStorage.getItem('page2Completed') !== 'true') {
                alert('لطفاً ابتدا صفحه دوم را تکمیل کنید.');
                return; // اگر صفحه دوم تکمیل نشده باشد، از ادامه عملکرد جلوگیری می‌کند
            }

            // ذخیره وضعیت تکمیل صفحه سوم در localStorage
            localStorage.setItem('page3Completed', 'true'); // ذخیره وضعیت تکمیل صفحه سوم

            // هدایت به لینک مرحله سوم
            window.location.href = 'https://survey.porsline.ir/s/Nf2hOR20'; // لینک مرحله سوم
        }

        // اگر صفحه دوم تکمیل نشده باشد، دکمه غیر فعال می‌شود و پیامی نشان داده می‌شود
        if (localStorage.getItem('page2Completed') !== 'true') {
            document.getElementById('goToThirdLink').disabled = true;
            document.getElementById('goToThirdLink').innerText = "لطفاً ابتدا صفحه دوم را تکمیل کنید";
        }
    </script>
</body>
</html>
