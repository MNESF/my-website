<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحله سوم</title>
</head>
<body>
    <h1>مرحله سوم</h1>
    <p>شما وارد مرحله سوم شده‌اید.</p>

    <button onclick="completeStep()">تکمیل مرحله سوم</button>

    <script>
        // زمانی که کاربر دکمه را کلیک می‌کند، صفحه سوم تکمیل می‌شود
        function completeStep() {
            // بررسی اینکه آیا صفحه دوم تکمیل شده است یا نه
            if (localStorage.getItem('page2Completed') !== 'true') {
                alert('لطفاً ابتدا صفحه دوم را تکمیل کنید.');
                return; // اگر صفحه دوم تکمیل نشده باشد، از ادامه عملکرد جلوگیری می‌کند
            }

            // ذخیره وضعیت تکمیل صفحه سوم در localStorage
            localStorage.setItem('page3Completed', 'true'); // ذخیره وضعیت تکمیل صفحه سوم
            
            // هدایت به لینک مرحله سوم
            window.location.href = 'https://survey.porsline.ir/s/Nf2hOR20'; // لینک مرحله سوم
        }

        // اگر صفحه دوم تکمیل نشده باشد، دکمه غیر فعال می‌شود و پیامی نشان داده می‌شود
        if (localStorage.getItem('page2Completed') !== 'true') {
            document.getElementById('goToThirdLink').disabled = true;
            document.getElementById('goToThirdLink').innerText = "لطفاً ابتدا صفحه دوم را تکمیل کنید";
        }
    </script>
</body>
</html>
