<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحله سوم</title>
</head>
<body>
    <h1>مرحله سوم</h1>
    <p>شما وارد مرحله سوم شده‌اید.</p>

    <!-- دکمه برای هدایت به مرحله سوم -->
    <button id="goToThirdLink" onclick="goToThirdLink()">رفتن به مرحله سوم</button>

    <script>
        // بررسی اینکه آیا صفحه دوم تکمیل شده است یا نه
        function goToThirdLink() {
            // اگر صفحه دوم تکمیل نشده باشد، هدایت به صفحه دوم
            if (localStorage.getItem('page3Completed') !== 'true') {
                alert('لطفاً ابتدا صفحه دوم را تکمیل کنید.');
                window.location.href = 'page3.html'; // هدایت به صفحه دوم
            } else {
                // اگر صفحه دوم تکمیل شده باشد، هدایت به لینک مرحله سوم
                window.location.href = 'https://survey.porsline.ir/s/Nf2hOR20'; // لینک مرحله سوم
            }
        }

        // بررسی تکمیل صفحه دوم و غیرفعال کردن دکمه در صورت عدم تکمیل
        if (localStorage.getItem('page2Completed') !== 'true') {
            document.getElementById('goToThirdLink').disabled = true;
            document.getElementById('goToThirdLink').innerText = "لطفاً ابتدا صفحه دوم را تکمیل کنید";
        }
    </script>
</body>
</html>
