<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توضیحات و سوالات</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;

            /* بک‌گراند تصویری */
            background-image: url("https://raw.githubusercontent.com/MNESF/my-website/main/back1.jpg");
            background-size: cover;          /* کل صفحه رو پر کنه */
            background-position: center;     /* وسط چین */
            background-repeat: no-repeat;    /* تکرار نشه */
            background-attachment: fixed;    /* موقع اسکرول ثابت بمونه */

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: red;
            text-align: center;
        }

        h1 {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ff5f5f; /* تغییر رنگ دکمه */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #e04f4f; /* تغییر رنگ دکمه هنگام هاور */
        }

        button:active {
            transform: scale(1);
            background-color: #c03a3a; /* رنگ پس زمینه فعال */
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
        }

                .image-container {
            width: 200px;  /* عرض مربع */
            height: 215px; /* ارتفاع مربع */
            margin: 20px auto; /* فاصله از بالا و پایین */
            overflow: hidden; /* مخفی کردن قسمت‌های اضافی */
            border-radius: 10px; /* گوشه‌های نرم */
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* برای اینکه تصویر به صورت کامل در مربع قرار بگیرد */
        }

        .text-above {
            margin-bottom: 20px; /* فاصله از تصویر */
        }

        .text-below {
            margin-top: 20px; /* فاصله از تصویر */
        }

        
    </style>
</head>
<body>
    <div class="container">
        <h1>از این که تا اینجای راه همراه ما بودید سپاس گذاریم</h1>
        <h1>برای ورود به مسابقه و توضیحات بر روی لینک زیر کلید کنید</h1>

        <button id="goToSecondLink" onclick="completeStep()">این جا کلید کنید</button>
    </div>

    <script>
        // زمانی که کاربر دکمه را کلیک می‌کند، صفحه دوم تکمیل می‌شود
        function completeStep() {
            // بررسی اینکه آیا صفحه اول تکمیل شده است یا نه
            if (localStorage.getItem('page1Completed') !== 'true') {
                alert('لطفاً ابتدا صفحه اول را تکمیل کنید.');
                return; // اگر صفحه اول تکمیل نشده باشد، از ادامه عملکرد جلوگیری می‌کند
            }

            // ذخیره وضعیت تکمیل صفحه دوم در localStorage
            localStorage.setItem('page2Completed', 'true'); // ذخیره وضعیت تکمیل صفحه دوم
            
            // هدایت به لینک مرحله دوم
            window.location.href = 'https://survey.porsline.ir/s/O0EdL7Nb'; // لینک مرحله دوم
        }

        // اگر صفحه اول تکمیل نشده باشد، دکمه غیر فعال می‌شود و پیامی نشان داده می‌شود
        if (localStorage.getItem('page1Completed') !== 'true') {
            document.getElementById('goToSecondLink').disabled = true;
            document.getElementById('goToSecondLink').innerText = "لطفاً ابتدا صفحه اول را تکمیل کنید";
        }
    </script>
</body>
</html>
