<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توضیحات و سوالات</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("https://raw.githubusercontent.com/MNESF/my-website/main/back1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: black;
            text-align: center;
        }

        h1 {
            font-size: 1rem;
            margin-bottom: 20px;
            color: black;
            font-weight: bold;
        }

        h2 {
            font-size: 0.5rem;
            margin-bottom: 30px;
            color: black;
            font-weight: bold;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #8e44ad;
        }

        button:active {
            transform: scale(1);
            background-color: #7d3c98;
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
        }

        .image-container {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-above {
            margin-bottom: 20px;
        }

        .text-below {
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>از این که همراه ما بودید سپاس گذاریم</h2>
