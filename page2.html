<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توضیحات و سوالات</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("https://raw.githubusercontent.com/MNESF/my-website/main/back1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: black;
            text-align: center;
        }

        h1 {
    font-size: 1rem;
    margin-bottom: 20px;
    color: black; /* رنگ عنوان مشکی */
    font-weight: bold; /* اعمال ضخامت به فونت */
    font-family: 'Arial', sans-serif; /* انتخاب فونت تیتر */
}

        h2 {
            font-size: 1rem;
            margin-bottom: 30px;
            color: black; /* رنگ متن مشکی */
            font-weight: bold; /* اعمال ضخامت به فونت */
            font-family: 'Arial', sans-serif; /* انتخاب فونت تیتر */
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #8e44ad;
        }

        button:active {
            transform: scale(1);
            background-color: #7d3c98;
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
        }

        .image-container {
            width: 200px;
            height: 215px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-above {
            margin-bottom: 20px;
        }

        .text-below {
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>از این که همراه ما بودید سپاس گذاریم</h2>

        <!-- قرار دادن تصویر داخل یک مربع -->
        <div class="image-container">
            <img src="https://github.com/MNESF/my-website/raw/main/Untit%D8%B2%D8%B3%DB%8C%D8%B2%D8%B7%D8%B8led.png" alt="توضیح تصویر">
        </div>

        <h1>برای ورود به مسابقه و توضیحات بر روی لینک زیر کلید کنید</h1>

        <button id="goToSecondLink" onclick="completeStep()">این جا کلید کنید</button>
    </div>

    <script>
        // زمانی که کاربر دکمه را کلیک می‌کند، صفحه دوم تکمیل می‌شود
        function completeStep() {
            // حذف بررسی وضعیت صفحه اول
            // مستقیم به لینک مرحله دوم هدایت می‌شود
            window.location.href = 'https://survey.porsline.ir/s/O0EdL7Nb'; // لینک مرحله دوم
        }
    </script>
</body>
</html>
